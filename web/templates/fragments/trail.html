{{define "trail"}}<h2>Audit trail</h2>
<div class="table-wrap"><table>
  <thead><tr><th>When</th><th>Action</th><th>Actor</th><th>Revision</th></tr></thead>
  <tbody>{{range .}}<tr><td>{{when .OccurredAt}}</td><td>{{.Action}}</td><td>{{.Actor}}</td><td>{{with .Revision}}{{.}}{{end}}</td></tr>
  {{else}}<tr><td colspan="4" class="muted">No entries.</td></tr>{{end}}</tbody>
</table></div>{{end}}
