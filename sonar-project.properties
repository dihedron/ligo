# SonarQube Cloud analysis, run by the "Build and test" job of
# .github/workflows/ci.yml after the tests (Automatic Analysis must be off).
sonar.projectKey=dihedron_ligo
sonar.organization=dihedron
sonar.projectName=ligo
sonar.sourceEncoding=UTF-8

# Go code and the lab's scripts; tests apart. Fixtures are data, not code;
# generated protobuf code and the admin client generated by oapi-codegen
# (pkg/adminclient/internal/gen, 21,000 lines, checked by make generate-check)
# are not ours to analyse.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,sdk/java/src/test/**
sonar.exclusions=**/*_test.go,sdk/java/src/test/**,sdk/java/target/**,test/lab/java/**,test/fixtures/**,test/lab/plugins/**,test/lab/echo/**,dist/**,**/testdata/**,**/*.pb.go,pkg/adminclient/internal/gen/**,web/static/htmx.min.js,web/static/ext/**

# coverage of "go test ./... -coverprofile=coverage.txt" in the same job
sonar.go.coverage.reportPaths=coverage.txt

# the Java SDK (sdk/java): the "Build and test" job runs its tests with JaCoCo
# before the analysis, so that Sonar has the classes and the coverage
sonar.java.binaries=sdk/java/target/classes
sonar.java.test.binaries=sdk/java/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=sdk/java/target/site/jacoco/jacoco.xml

# profiling is opt-in: off unless the operator sets <BINARY>_CPU_PROFILE or
# <BINARY>_MEM_PROFILE, which needs control of the process environment.
sonar.issue.ignore.multicriteria=prof,tplid,cipw,cisecret,plsql
sonar.issue.ignore.multicriteria.prof.ruleKey=go:S4507
sonar.issue.ignore.multicriteria.prof.resourceKey=cmd/*/init.go
# The UI's templates are Go html/template files: an id repeated in the
# branches of {{if}}/{{else}} is rendered once; Sonar reads them as plain HTML.
sonar.issue.ignore.multicriteria.tplid.ruleKey=Web:S7930
sonar.issue.ignore.multicriteria.tplid.resourceKey=web/templates/**

# CI's values are for its own throwaway PostgreSQL container on localhost,
# which holds nothing and lives for one job.
sonar.issue.ignore.multicriteria.cipw.ruleKey=yaml:S2068
sonar.issue.ignore.multicriteria.cipw.resourceKey=.github/workflows/ci.yml
sonar.issue.ignore.multicriteria.cisecret.ruleKey=secrets:S6698
sonar.issue.ignore.multicriteria.cisecret.resourceKey=.github/workflows/ci.yml
# The migrations are PostgreSQL, which has no VARCHAR2; Sonar reads .sql as PL/SQL.
sonar.issue.ignore.multicriteria.plsql.ruleKey=plsql:CharVarchar
sonar.issue.ignore.multicriteria.plsql.resourceKey=migrations/**

# The UI's script runs in the browser: the browser tests (headless Chrome)
# exercise it, but Go's coverage profile cannot measure JavaScript.
sonar.coverage.exclusions=web/static/**
