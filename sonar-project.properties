# SonarQube Cloud analysis, run by the "Build and test" job of
# .github/workflows/ci.yml after the tests (Automatic Analysis must be off).
sonar.projectKey=dihedron_ligo
sonar.organization=dihedron
sonar.projectName=ligo
sonar.sourceEncoding=UTF-8

# Go code and the lab's scripts; tests apart. Fixtures are data, not code;
# generated protobuf code is not ours to analyse.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go,test/fixtures/**,test/lab/plugins/**,test/lab/echo/**,dist/**,**/testdata/**,**/*.pb.go,web/static/htmx.min.js,web/static/ext/**

# coverage of "go test ./... -coverprofile=coverage.txt" in the same job
sonar.go.coverage.reportPaths=coverage.txt

# profiling is opt-in: off unless the operator sets <BINARY>_CPU_PROFILE or
# <BINARY>_MEM_PROFILE, which needs control of the process environment.
sonar.issue.ignore.multicriteria=prof,tplid
sonar.issue.ignore.multicriteria.prof.ruleKey=go:S4507
sonar.issue.ignore.multicriteria.prof.resourceKey=cmd/*/init.go
# The UI's templates are Go html/template files: an id repeated in the
# branches of {{if}}/{{else}} is rendered once; Sonar reads them as plain HTML.
sonar.issue.ignore.multicriteria.tplid.ruleKey=Web:S7930
sonar.issue.ignore.multicriteria.tplid.resourceKey=web/templates/**

# The UI's script runs in the browser: the browser tests (headless Chrome)
# exercise it, but Go's coverage profile cannot measure JavaScript.
sonar.coverage.exclusions=web/static/**
