service:
  application_version: "4.0.1"          # passed to DBOS (EXT-09)
  startup_timeout: 60s                   # SPIRE and the sealer must be ready within it (§8.2)
  instance_id_env: "LIGO_INSTANCE_ID"  # unique per replica
  workload_advertise:                    # how workloads reach the workload API; served as the "ligo" flow (ADR-16)
    destination: "ligo.prod.internal"
    port: 8443
    server_name: "ligo.prod.internal"

realms:
  - name: prod
    trust_domain: prod.internal
    spiffe_workload_socket: "unix:///run/spire/prod/agent.sock"
  - name: test
    trust_domain: test.internal
    spiffe_workload_socket: "unix:///run/spire/test/agent.sock"

core_identity:                           # ligo's own SVID (serving TLS, Vault Transit)
  realm: prod
  svid_selector:
    match_expr: 'path == "/ns/sys/sa/ligo"'
    jwt_audience: ["https://vault.prod.internal"]

server:
  workload_listener:
    listen_address: "0.0.0.0:8443"
    tls_source: spiffe                   # spiffe | file
    auth_modes: [x509_svid, jwt_svid]
    accepted_trust_domains: [prod.internal, test.internal, cloud.internal]
    federated_trust_domains:              # §7.1, §10.5 Topology C
      - { trust_domain: cloud.internal, via_realm: prod }   # multi-tenant cloud platform, verified through federation
    expected_jwt_audience: "spiffe://prod.internal/ns/sys/sa/ligo"
    max_token_ttl: 15m
    clock_skew: 30s
    rate_limit: { per_svid_rps: 5, burst: 20 }
    resolution_cache: { full_reload_interval: 30s, max_staleness: 5m }

  admin_listener:
    listen_address: "0.0.0.0:9443"
    external_origin: "https://ligo-admin.corp.internal:9443"
    tls_source: file
    tls_cert_file: "/etc/ligo/tls/admin.crt"
    tls_key_file: "/etc/ligo/tls/admin.key"
    client_svid_auth: { enabled: true, accepted_trust_domains: [prod.internal] }
    allow_basic_auth: false
    session: { idle_timeout: 30m, absolute_timeout: 8h, authz_recheck_interval: 5m }
    rate_limit: { login_per_ip_per_min: 10, login_per_user_per_min: 5, login_per_user_global_per_min: 50, api_per_principal_rps: 10, max_tracked_keys: 1000000 }

  metrics_listener:                       # GET /metrics, plain HTTP and no authentication (§10.1): loopback or a management network
    listen_address: "127.0.0.1:9090"     # default

observability:
  tracing:                                # OpenTelemetry traces (§10.1)
    otlp_endpoint: ""                     # host:port of an OTLP/gRPC collector; empty: tracing off (default)
    sample_ratio: 0.1                     # share of new traces kept (0 to 1, default 0.1); a sampled caller's are always kept
    insecure: false                       # true only for a collector without TLS
    # ca_cert_file: "/etc/ligo/tls/corp-ca.crt"   # CAs trusted for the collector; default the system roots

admin_auth:
  ldap:
    url: "ldaps://ldap.corp.internal:636"
    ca_cert_file: "/etc/ligo/tls/corp-ca.crt"
    service_bind_dn: "cn=ligo-admin-auth,ou=services,dc=corp,dc=internal"
    service_bind_password_env: "LIGO_LDAP_BIND_PASS"
    user_base_dn: "ou=users,dc=corp,dc=internal"
    user_filter: "(&(objectClass=inetOrgPerson)(uid=%s))"
    group_membership_filter: "(member=%s)"
    nested_groups: false

authorization:                            # roles are granted on jurisdiction patterns (§3.9, §7.2.2)
  bindings:
    - { ldap_group_dn: "cn=ligo-viewers,ou=groups,dc=corp,dc=internal",          role: viewer,      jurisdictions: ["*"] }
    # Central data centre teams: own the platforms (platform jurisdiction dc/corp-prod)
    - { ldap_group_dn: "cn=ligo-operators-prod,ou=groups,dc=corp,dc=internal",   role: operator,    jurisdictions: ["dc/corp-prod"] }
    - { ldap_group_dn: "cn=ligo-approvers-prod,ou=groups,dc=corp,dc=internal",   role: approver,    jurisdictions: ["dc/corp-prod"] }
    - { ldap_group_dn: "cn=ligo-breakglass-prod,ou=groups,dc=corp,dc=internal",  role: break_glass, jurisdictions: ["dc/corp-prod/*"] }
    # An application team owning targets on the shared platforms (target jurisdiction dc/corp-prod/ledger)
    - { ldap_group_dn: "cn=ledger-dbas,ou=groups,dc=corp,dc=internal",           role: operator,    jurisdictions: ["dc/corp-prod/ledger"] }
    - { ldap_group_dn: "cn=ledger-leads,ou=groups,dc=corp,dc=internal",          role: approver,    jurisdictions: ["dc/corp-prod/ledger"] }
    - { ldap_group_dn: "cn=ligo-operators-test,ou=groups,dc=corp,dc=internal",   role: operator,    jurisdictions: ["dc/corp-test"] }
    - { spiffe_id: "spiffe://prod.internal/ns/ci/sa/ligo-deployer",              role: operator,    jurisdictions: ["dc/corp-test"] }
    # A cloud tenancy: self-service developers and their leads
    - { ldap_group_dn: "cn=cloud-fin01-payments-devs,ou=groups,dc=corp,dc=internal",  role: operator,    jurisdictions: ["cloud/fin-01/payments"] }
    - { ldap_group_dn: "cn=cloud-fin01-payments-leads,ou=groups,dc=corp,dc=internal", role: approver,    jurisdictions: ["cloud/fin-01/payments"] }
    - { ldap_group_dn: "cn=cloud-fin01-breakglass,ou=groups,dc=corp,dc=internal",     role: break_glass, jurisdictions: ["cloud/fin-01/*"] }
    - { ldap_group_dn: "cn=infosec-breakglass,ou=groups,dc=corp,dc=internal",         role: break_glass, jurisdictions: ["sec/infosec"] }
    # Information Security, an additional party for cloud-to-data-centre connections (ADR-14)
    - { ldap_group_dn: "cn=infosec-approvers,ou=groups,dc=corp,dc=internal",     role: approver,    jurisdictions: ["sec/infosec"] }
    # Delegated approval (ADR-11): SPIFFE principals only; see §10.6 for identity requirements.
    - spiffe_id: "spiffe://prod.internal/ns/automation-prod/sa/awx-runner-db-team"
      role: trusted_automation
      jurisdictions: ["dc/corp-prod/*"]
      platforms: ["oracle-prod"]                   # optional; omit to cover every platform in the jurisdictions
      approval_reference_pattern: '^CHG[0-9]{7}$'  # optional; RE2, fully anchored
      rate_limit: { api_rps: 50, burst: 200 }      # optional; overrides admin_listener.rate_limit.api_per_principal_rps
  approval:
    required_jurisdictions: ["dc/corp-prod/*", "cloud/fin-01/*"] # jurisdictions whose sides need an approver (ADR-09)
    require_distinct_approvers_across_jurisdictions: true        # ADR-13 rule 7 (default true)
    change_request_ttl: 72h

charter:                               # ADR-13, ADR-14, §3.9
  source_jurisdictions:                          # exactly one entry per trust domain listed in any allowed_source_trust_domains
    - { trust_domain: prod.internal, mode: static, jurisdiction: "dc/corp-prod" }
    - { trust_domain: test.internal, mode: static, jurisdiction: "dc/corp-test" }
    - trust_domain: cloud.internal
      mode: path_template
      path_regex: '^/acct/([a-z0-9-]+)/tenant/([a-z0-9-]+)/'   # matched against the regex's fixed prefix only
      jurisdiction_template: 'cloud/${1}/${2}'
  name_prefixes:                          # §3.8; first matching entry wins; {n} = n-th segment of the owner jurisdiction
    - { jurisdictions: ["cloud/*"], prefix: "{2}-{3}-", resources: [source, target, binding] }  # cloud/fin-01/payments -> "fin-01-payments-"
  interconnects:                          # ADR-14; evaluated in order for binding changes with consent ALL across jurisdictions
    default_cross_jurisdiction: deny             # deny | allow, for cross-jurisdiction pairs no rule matches
    rules:
      - name: no-test-to-prod
        from: ["dc/corp-test/*", "cloud/fin-01-test/*"]   # patterns match whole segments only (§3.9)
        to:   ["dc/corp-prod/*"]
        action: deny
      - name: within-dc-prod              # data centre workloads (dc/corp-prod) to application-owned targets below it
        from: ["dc/corp-prod/*"]
        to:   ["dc/corp-prod/*"]
        action: allow
      - name: cloud-to-dc
        from: ["cloud/*"]
        to:   ["dc/corp-prod/*"]
        action: allow
        additional_approvals:
          - { name: security, jurisdiction: "sec/infosec" }
      - name: dc-to-cloud
        from: ["dc/corp-prod/*"]
        to:   ["cloud/*"]
        action: allow
      - name: cloud-within-account
        from: ["cloud/fin-01/*"]
        to:   ["cloud/fin-01/*"]
        action: allow
        distinct_approvers: false           # one lead may approve both tenancies of the same account (R-09)

regex_policy:
  max_length: 512
  min_literal_path_segments: 2            # Appendix A.2, rule 6
  narrowing_state_limit: 20000            # §3.10, Appendix D.3; undecided => not narrowing

bindings:                                 # §3.5, §6.3
  max_expiry: 8760h                       # longest allowed expiresAt from now (365 days)
  expiry_warning: 168h                    # BINDING_EXPIRING this long before expiry

propagation:                              # §6.8
  interval: 5s
  max_concurrent: 8

storage:
  postgres:
    app_dsn_env: "LIGO_PG_APP_DSN"
    reader_dsn_env: "LIGO_PG_READER_DSN"
    dbos_dsn_env: "LIGO_PG_DBOS_DSN"
    max_conns: 25
    app_statement_timeout: 5s
    reader_statement_timeout: 500ms
  dbos:
    workflow_retention: 168h
  audit:
    retention: 0s                         # 0: keep every entry; else at least 24h, and only what was exported is pruned
  change_requests:
    retention: 0s                         # 0: keep every request; else at least 24h, and only requests no audit entry names

secret_sealing:
  provider: vault-transit                 # vault-transit | local-kek (requires --insecure-dev)
  vault_transit:
    address: "https://vault.prod.internal:8200"
    namespace: "prod"
    auth_mount: "jwt-spiffe"
    role: "ligo-sealer"
    jwt_audience: "https://vault.prod.internal"
    mount: "transit"
    key_name: "ligo-interstage"
    # ca_cert_file: "/etc/ligo/tls/corp-ca.crt"   # CAs trusted for address; default the system roots
  # local_kek_file: "/etc/ligo/dev/kek"   # local-kek only: 32-byte key, not group- or world-readable

plugins:
  directory: "/usr/lib/ligo/plugins"
  rpc_timeout: 60s
  retry: { max_attempts: 5, initial_backoff: 2s, max_backoff: 60s }
  max_concurrent_rpcs_per_instance: 4
  restart_backoff: { initial: 1s, max: 60s }
  # The lease of a credential issued on demand (vault-dynamic), for a platform
  # that sets no credential_ttl or credential_max_ttl of its own; these are
  # the defaults. Each between 1m and 720h.
  dynamic_credentials: { default_ttl: 1h, max_ttl: 24h }

ui:                                       # §7.6
  theme:
    default_mode: system                  # system | light | dark
    product_name: "ligo"
    directory: "/etc/ligo/theme"       # conventional files: theme.css, logo.svg|png, logo-dark.svg|png, favicon.*, fonts/*.woff2
    # Explicit paths override the conventional files (all optional):
    # css_file: "/etc/ligo/theme/corp.css"
    # logo_file: "/etc/ligo/theme/corp-logo.svg"
    # logo_dark_file: "/etc/ligo/theme/corp-logo-white.svg"
    # favicon_file: "/etc/ligo/theme/corp.ico"
    # fonts_dir: "/etc/ligo/theme/fonts"
    colors:                               # optional token overrides, served as /ui/theme/tokens.css
      light: { primary: "#1f4e8c", primary-contrast: "#ffffff" }
      dark:  { primary: "#8fb4e8", primary-contrast: "#0b1a2e" }

break_glass:                              # ADR-12; role holders are set in authorization.bindings (role: break_glass)
  min_justification_length: 20
  incident_reference_pattern: '^INC[0-9]{7}$'   # optional; RE2, fully anchored
  policies:                               # first entry whose pattern matches a side's jurisdiction applies to that side
    - { jurisdictions: ["dc/corp-prod/*"], default_ttl: 4h, max_ttl: 8h, max_open: 5, warn_before: 1h }
    - { jurisdictions: ["cloud/fin-01/*"], default_ttl: 2h, max_ttl: 4h, max_open: 3, warn_before: 30m }
    - { jurisdictions: ["sec/infosec"], default_ttl: 2h, max_ttl: 4h, max_open: 3, warn_before: 30m }

notifications:                            # §7.5
  delivered_retention: 24h                # a delivered event's row is purged after this; 0: at once
  abandoned_retention: 720h               # an abandoned one's after this
  webhooks:
    - name: oncall
      url: "https://oncall.corp.internal/hooks/ligo"
      ca_cert_file: "/etc/ligo/tls/corp-ca.crt"
      hmac_secret_env: "LIGO_WEBHOOK_ONCALL_SECRET"
      timeout: 5s
      events: [BREAK_GLASS_USED, BREAK_GLASS_EXPIRING, BREAK_GLASS_REVERTED, BREAK_GLASS_REVERT_FAILED,
               BREAK_GLASS_RATIFIED, BREAK_GLASS_REVIEW_OVERDUE, CONFIG_APPROVAL_POLICY_WEAKENED,
               CONFIG_CHARTER_CHANGED, SYSTEM_INTERCONNECT_VIOLATIONS]
    - name: dba-queue                     # the data centre DBAs' ticket queue: only their own decisions
      url: "https://tickets.corp.internal/hooks/ligo-dba"
      ca_cert_file: "/etc/ligo/tls/corp-ca.crt"
      hmac_secret_env: "LIGO_WEBHOOK_DBA_SECRET"
      timeout: 5s
      jurisdictions: ["dc/corp-prod/*"]          # §7.5 jurisdiction filter
      events: [CR_AWAITING_APPROVAL]

reconciliation:
  enabled: true
  interval: 6h
  jitter: 30m
  max_concurrent: 4

# Plugin types (§5.9). Their instances (platforms, identity provider and
# secret store instances) live in the database, created with ligo apply from
# manifests such as examples/instances.yaml (.specs/ligo-instances.md).
# instance_bounds is the platform team's limit on where the instances of a
# type may connect and send a bootstrap credential: REQUIRED for a type that
# is not builtin ([] allows no endpoint), in the syntax of allowed_endpoints.
identity_providers:
  - { type: "svid.v1", builtin: true }
  - { type: "target-local.v1", builtin: true }
  - { type: "delegated-dynamic.v1", builtin: true }
  - type: "openldap.v1"
    builtin: false
    binary: "ligo-plugin-openldap"                 # relative to plugins.directory
    sha256: "<64-hex-sha256-of-ligo-plugin-openldap>"
    instance_bounds:
      allowed_endpoints: ["openldap.prod.internal:636", "vault.prod.internal:8200"]

secret_stores:
  - { type: "none.v1", builtin: true }
  - type: "vault.v1"
    builtin: false
    binary: "ligo-plugin-vault"
    sha256: "<64-hex-sha256-of-ligo-plugin-vault>"
    instance_bounds:
      allowed_endpoints: ["vault.prod.internal:8200", "vault.test.internal:8200"]

platform_providers:                       # plugin types; their platforms are in the database (§3.4)
  - type: "oracle.v1"
    builtin: false
    binary: "ligo-plugin-oracle"
    sha256: "<64-hex-sha256-of-ligo-plugin-oracle>"
    instance_bounds:
      allowed_endpoints: ["ora-scan.prod.internal:1521", "ledger-db.prod.internal:1522", "ora-test.test.internal:1521",
        "vault.prod.internal:8200", "vault.test.internal:8200"]
