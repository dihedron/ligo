name: CI

# One workflow, three parallel jobs: the build (gofmt, go vet,
# golangci-lint with gosec and compile through "make"; the unit and
# integration tests together, against a PostgreSQL container, so that one
# coverage report counts both; then the SonarQube Cloud analysis of the
# same checkout and coverage), the secret scans, and, on pull requests, the
# dependency review.
# Jobs run side by side on their own runners, so the run takes as long as
# the slowest of them; CodeQL, the documents and releases keep workflows
# of their own (other triggers and permissions).
#
# Branch pushes run the build and the scans; their checks show on a pull
# request for the same commit, so pull requests only add the dependency
# review. The daily schedule re-runs the secret scans with current rules.

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

# a newer push to the same branch cancels the run it supersedes, except on
# main, where every commit keeps its run
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build and test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC, no CODECOV_TOKEN secret
    # the lab (test/lab) runs the integration tests over TLS on a VM; CI runs
    # them against a container, without TLS
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      LIGO_TEST_TARGET_ADMIN_DSN: postgres://lab_target_admin:target@localhost:5432/ledger?sslmode=disable
      LIGO_TEST_PG_MIGRATOR_DSN: postgres://ligo_migrator:migrator@localhost:5432/ligo?sslmode=disable
      LIGO_TEST_PG_APP_DSN: postgres://ligo_app:app@localhost:5432/ligo?sslmode=disable
      LIGO_TEST_PG_READER_DSN: postgres://ligo_reader:reader@localhost:5432/ligo?sslmode=disable
      LIGO_TEST_PG_DBOS_DSN: postgres://ligo_dbos:dbos@localhost:5432/ligo?sslmode=disable
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git describe stamps the version; Sonar blames new code

      - name: Set up Go compiler
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true

      - name: Install golangci-lint (make lint, before every build)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14
          install-only: true

      - name: Lint and build
        run: make

      # Node and npx come with the runner; the Redocly CLI version is pinned
      # in custom.mk (REDOCLY_VERSION)
      - name: Lint the OpenAPI document (make openapi-lint)
        run: make openapi-lint

      # the admin API client's generated code is checked in; it must be what
      # the OpenAPI document generates
      - name: Check the generated admin client (make generate-check)
        run: make generate-check

      # the roles and the database of §4.1, as operations create them
      - name: Create the database roles
        run: >-
          psql -v migrator_password=migrator -v app_password=app
          -v reader_password=reader -v dbos_password=dbos
          -f test/lab/sql/roles.sql

      - name: Create the target database of ligo-plugin-postgres
        run: psql -v admin_password=target -f test/lab/sql/target.sql

      - name: Test with coverage
        # unit and integration tests in one run; -coverpkg credits code with
        # the coverage of every package's tests, not only its own; -p 1: the
        # packages share one database, and the singletons act on all of it
        run: go test -count=1 -p 1 -tags integration ./... -coverpkg=./... -coverprofile=coverage.txt
      # the Java SDK's tests, with JaCoCo, for the Sonar analysis below
      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: sdk/java/pom.xml
      - name: Test the Java SDK with coverage
        run: make java-test

      - name: Merge coverage blocks
        # with -coverpkg every test binary reports every block, most with 0;
        # SonarCloud does not merge them, so keep the highest count of each
        run: |
          awk 'NR == 1 { print; next } { k = $1 " " $2; if (!(k in c)) o[++n] = k; if (!(k in c) || $3 > c[k]) c[k] = $3 }
            END { for (i = 1; i <= n; i++) print o[i], c[o[i]] }' coverage.txt > coverage.merged
          mv coverage.merged coverage.txt

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true

      # skipped where the secret is not available (Dependabot, forks)
      - name: Check for the SonarQube token
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: echo "enabled=${SONAR_TOKEN:+yes}" >> "$GITHUB_OUTPUT"

      - name: Cache SonarQube packages
        if: steps.sonar.outputs.enabled == 'yes'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # settings and coverage report in sonar-project.properties
      - name: Analyse with SonarQube Cloud
        if: steps.sonar.outputs.enabled == 'yes'
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # the Python SDK (sdk/python): lint, types, tests, the audit of its
  # dependencies, and the wheel and sdist build, on every supported Python
  python:
    name: Python SDK (${{ matrix.python }})
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs reads the version from git tags

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml

      - name: Install the SDK and its development tools
        run: python -m pip install -e "sdk/python[dev]"

      - name: Lint and type-check (make py-lint)
        run: make py-lint

      - name: Test (make py-test)
        run: make py-test

      # the project's own dependencies, resolved afresh: the runner's setuptools
      # and pip are not the SDK's
      - name: Audit the dependencies
        run: python -m pip_audit sdk/python

      - name: Build the wheel and the sdist (make py-build)
        run: make py-build

  # the Java SDK (sdk/java): tests, dependency convergence, SpotBugs, javadoc and
  # the jar build, on the oldest and the newest supported JDK
  java:
    name: Java SDK (${{ matrix.java }})
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: sdk/java/pom.xml

      - name: Test (make java-test)
        run: make java-test

      - name: Dependency convergence, SpotBugs and javadoc (make java-lint)
        run: make java-lint

      - name: Build the jars (make java-build)
        run: make java-build

  # the dependencies of the Java SDK against the OSV database
  java-audit:
    name: Java SDK dependency audit
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --recursive
            ./sdk/java

  secrets:
    name: Secret scans
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # both scanners read the whole history

      # with the repository's .gitleaks.toml (if present); "make scanners"
      # compares these pinned versions with the latest releases, which
      # "make secrets" runs: bump the pins when they fall behind
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1

      # reports only secrets it can verify as live, or cannot rule out
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71 # v3.100.1
        with:
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --results=verified,unknown

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
