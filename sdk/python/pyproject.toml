[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "ligo-client"
dynamic = ["version"]
description = "Python SDK for workloads that use ligo: bindings, network flows, credentials."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrea Funtò" }]
dependencies = [
    "spiffe>=0.4,<0.5",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "mypy>=1.11", "ruff>=0.6", "pip-audit>=2.7"]

[tool.hatch.version]
source = "vcs"
raw-options = { root = "../..", tag_regex = "^v(?P<version>[0-9].*)$", fallback_version = "0.0.0.dev0" }

[tool.hatch.build.targets.wheel]
packages = ["src/ligo_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["spiffe", "spiffe.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S104", "S105", "S106", "S108"]
