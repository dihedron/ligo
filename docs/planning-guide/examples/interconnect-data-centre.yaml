# Blueprint: a traditional data centre interconnected with a multitenant
# cloud (Planning for Deployment Guide, chapter 13): the data centre installation.
# Loaded and validated by docs/docs_test.go.
service:
  application_version: "0.2.0"
  instance_id_env: "LIGO_INSTANCE_ID"
  workload_advertise: { destination: "ligo.dc.internal", port: 8443, server_name: "ligo.dc.internal" }

realms:                                        # topology A: ligo provisions in both domains
  - { name: prod, trust_domain: prod.dc.internal, spiffe_workload_socket: "unix:///run/spire/prod/agent.sock" }
  - { name: test, trust_domain: test.dc.internal, spiffe_workload_socket: "unix:///run/spire/test/agent.sock" }

core_identity:                                 # from the strictest domain
  realm: prod
  svid_selector: { match_expr: 'path == "/ns/sys/sa/ligo"', jwt_audience: ["https://vault.prod.dc.internal"] }

server:
  workload_listener:
    listen_address: "0.0.0.0:8443"
    tls_source: file                           # a corporate CA certificate, so test workloads need no prod bundle
    tls_cert_file: "/etc/ligo/tls/workload.crt"
    tls_key_file: "/etc/ligo/tls/workload.key"
    auth_modes: [x509_svid, jwt_svid]
    accepted_trust_domains: [prod.dc.internal, test.dc.internal, cloud.internal]
    federated_trust_domains:                   # the data centre's SPIRE decides to trust the cloud
      - { trust_domain: cloud.internal, via_realm: prod }
    expected_jwt_audience: "spiffe://prod.dc.internal/ns/sys/sa/ligo"
  admin_listener:
    listen_address: "0.0.0.0:9443"
    external_origin: "https://ligo-admin.dc.internal"
    tls_source: file
    tls_cert_file: "/etc/ligo/tls/admin.crt"
    tls_key_file: "/etc/ligo/tls/admin.key"
    client_svid_auth: { enabled: true, accepted_trust_domains: [prod.dc.internal] }   # admin SVIDs only from production

admin_auth:
  ldap:
    url: "ldaps://ldap.dc.internal:636"
    ca_cert_file: "/etc/ligo/tls/dc-ca.crt"
    service_bind_dn: "cn=ligo-admin-auth,ou=services,dc=dc,dc=internal"
    service_bind_password_env: "LIGO_LDAP_BIND_PASS"
    user_base_dn: "ou=users,dc=dc,dc=internal"
    user_filter: "(&(objectClass=inetOrgPerson)(uid=%s))"
    group_membership_filter: "(member=%s)"

authorization:
  bindings:
    - { ldap_group_dn: "cn=ligo-viewers,ou=groups,dc=dc,dc=internal", role: viewer, jurisdictions: ["*"] }
    # The DBA team runs the database platforms
    - { ldap_group_dn: "cn=dba,ou=groups,dc=dc,dc=internal", role: operator, jurisdictions: ["dc/prod/dba", "dc/test/dba"] }
    - { ldap_group_dn: "cn=dba-leads,ou=groups,dc=dc,dc=internal", role: approver, jurisdictions: ["dc/prod/dba"] }
    # An application team: its workloads in the core and the DMZ, its data
    - { ldap_group_dn: "cn=orders-devs,ou=groups,dc=dc,dc=internal", role: operator, jurisdictions: ["dc/prod/core/orders", "dc/prod/dmz/orders", "dc/prod/data/orders"] }
    - { ldap_group_dn: "cn=orders-leads,ou=groups,dc=dc,dc=internal", role: approver, jurisdictions: ["dc/prod/core/orders", "dc/prod/dmz/orders", "dc/prod/data/orders"] }
    # Information Security approves what reaches internal data from the DMZ
    - { ldap_group_dn: "cn=infosec,ou=groups,dc=dc,dc=internal", role: approver, jurisdictions: ["sec/infosec"] }
    # Developers serve themselves in test
    - { ldap_group_dn: "cn=developers,ou=groups,dc=dc,dc=internal", role: operator, jurisdictions: ["dc/test/apps", "dc/test/data/*"] }
    - { ldap_group_dn: "cn=ligo-oncall,ou=groups,dc=dc,dc=internal", role: break_glass, jurisdictions: ["dc/prod/*"] }
    - { ldap_group_dn: "cn=dc-account-admins,ou=groups,dc=dc,dc=internal", role: account_admin }   # registers the cloud accounts allowed in
    # Change automation: AWX on dedicated nodes, after an approved ITSM change
    - spiffe_id: "spiffe://prod.dc.internal/ns/automation/sa/awx-db"
      role: trusted_automation
      jurisdictions: ["dc/prod/data/*"]
      approval_reference_pattern: '^CHG[0-9]{7}$'
  approval:
    required_jurisdictions: ["dc/prod/*", "sec/infosec", "cloud/*"]   # test is self-service

charter:
  accounts:                                    # cloud accounts, as the cloud defines them; the cloud's directory is mirrored here
    jurisdiction: "cloud/{account}"
    source_jurisdiction: "cloud/{account}/app/{project}"
    target_jurisdiction: "cloud/{account}/data/{tenancy}"
    ldap_groups:
      search_base: "ou=cloud-accounts,dc=dc,dc=internal"
      roles:
        - { group_dn: "cn=approvers,ou={account},ou=cloud-accounts,dc=dc,dc=internal", role: approver, jurisdiction: "cloud/{account}/*" }
        - { group_dn: "cn=operators,ou={account},ou=cloud-accounts,dc=dc,dc=internal", role: operator, jurisdiction: "cloud/{account}/*" }
  source_jurisdictions:
    - { trust_domain: cloud.internal, mode: path_template, path_regex: '^/acct/([a-z0-9]+)/project/([a-z0-9]+)/', jurisdiction_template: 'cloud/${1}/app/${2}' }
    - trust_domain: prod.dc.internal           # /seg/<core|dmz>/team/<team>/...
      mode: path_template
      path_regex: '^/seg/([a-z0-9]+)/team/([a-z0-9]+)/'
      jurisdiction_template: 'dc/prod/${1}/${2}'
    - { trust_domain: test.dc.internal, mode: static, jurisdiction: "dc/test/apps" }
  interconnects:
    default_cross_jurisdiction: deny
    rules:                                     # first match wins: denials first
      - { name: no-test-to-prod, from: ["dc/test/*"], to: ["dc/prod/*"], action: deny }
      - { name: no-prod-to-test, from: ["dc/prod/*"], to: ["dc/test/*"], action: deny }
      - { name: core-to-data, from: ["dc/prod/core/*"], to: ["dc/prod/data/*"], action: allow }
      - name: dmz-to-data
        from: ["dc/prod/dmz/*"]
        to: ["dc/prod/data/*"]
        action: allow
        additional_approvals: [ { name: security, jurisdiction: "sec/infosec" } ]
      - name: cloud-to-dc-data                 # a cloud account reaching data-centre data: Information Security consents too
        from: ["cloud/*"]
        to: ["dc/prod/data/*"]
        action: allow
        additional_approvals: [ { name: security, jurisdiction: "sec/infosec" } ]
      - { name: test-apps-to-data, from: ["dc/test/apps"], to: ["dc/test/data/*"], action: allow }

break_glass:
  min_justification_length: 20
  incident_reference_pattern: '^INC[0-9]{7}$'
  policies:
    - { jurisdictions: ["dc/prod/*"], default_ttl: 4h, max_ttl: 8h, max_open: 5, warn_before: 1h }

storage:
  postgres:
    app_dsn_env: "LIGO_PG_APP_DSN"
    reader_dsn_env: "LIGO_PG_READER_DSN"
    dbos_dsn_env: "LIGO_PG_DBOS_DSN"

secret_sealing:
  provider: vault-transit
  vault_transit:
    address: "https://vault.prod.dc.internal:8200"
    auth_mount: "jwt-spiffe"
    role: "ligo-sealer"
    jwt_audience: "https://vault.prod.dc.internal"
    mount: "transit"
    key_name: "ligo-interstage"

plugins:
  directory: "/usr/lib/ligo/plugins"

# Plugin types (§5.9); their instances are created with ligo apply from planning-guide/examples/instances/interconnect-data-centre.yaml
# (.specs/ligo-instances.md). instance_bounds bounds where they may connect.
identity_providers:
  - { type: target-local.v1, builtin: true }

secret_stores:
  - type: "vault.v1"
    binary: "ligo-plugin-vault"
    sha256: "<64-hex-sha256-of-ligo-plugin-vault>"
    instance_bounds:
      allowed_endpoints: ["vault.prod.dc.internal:8200", "vault.test.dc.internal:8200"]

platform_providers:
  - type: "postgres.v1"
    binary: "ligo-plugin-postgres"
    sha256: "<64-hex-sha256-of-ligo-plugin-postgres>"
    instance_bounds:
      allowed_endpoints: ["pg.prod.dc.internal:5432", "vault.prod.dc.internal:8200", "pg.test.dc.internal:5432", "vault.test.dc.internal:8200"]
