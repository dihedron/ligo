# golangci-lint configuration: the standard linters, plus gosec, so that
# "make lint", CI and a developer's machine run the same security checks.
version: "2"

linters:
  default: standard
  enable:
    - gosec
  settings:
    gosec:
      excludes:
        # unchecked errors: errcheck reports them already, and honours the
        # //nolint:errcheck justifications in the code
        - G104
  exclusions:
    rules:
      # tests and test tooling read their own fixtures, write temporary
      # files and use made-up tokens
      - path: (_test\.go$|^test/)
        linters:
          - gosec
      # go-flags reads a flag's allowed values from repeated choice tags
      # (§8.4), which reflect.StructTag.Get would not see
      - text: 'SA5008: duplicate struct tag "choice"'
        linters:
          - staticcheck
