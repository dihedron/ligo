# Codecov: generated protobuf code, the lab's plugins and echo programs
# (test tooling, run only on the lab) are left out of the coverage figures, as in
# sonar-project.properties.
ignore:
  - "**/*.pb.go"
  - "test/lab/plugins/**"
  - "test/lab/echo/**"

# The same bar as SonarCloud's gate on new code; the project may dip by 1%
# (error-only branches) without failing a pull request.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%
