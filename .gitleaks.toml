# Gitleaks configuration: the default rules, with one allowlist for paths
# that git ignores and that "make secrets" still sees when it scans the
# working tree: the local lab's state (its CA, server key and passwords),
# and build output. They are never committed.
title = "ligo"

[extend]
useDefault = true

[allowlist]
description = "git-ignored local state and build output"
paths = ['''(^|/)test/lab/\.state/''', '''(^|/)dist/''', '''(^|/)build/''']

# The lab pins the fingerprint of lxd-spiffe's packaging key (a public GPG
# key fingerprint, 40 hex digits) in lab.env; generic-api-key mistakes it for
# a key. Allowed only in that file and only for that shape.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "the pinned fingerprint of a public packaging key"
condition = "AND"
paths = ['''(^|/)test/lab/lab\.env$''']
regexes = ['''^[0-9A-F]{40}$''']
